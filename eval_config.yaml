active_dataset: mt_syn #choose the dataset here

paths:
  gt_dir: "/mnt/md0/rajalakshmi/metrics/matching/data/ss_1/GT/" #path to GT graph folder
  pred_dir: "/mnt/md0/rajalakshmi/metrics/matching/data/ss_1/pred/" #path to pred graph
  main_script: "main.py"

evaluation_by_dataset:
  st_syn:
    matching: "hierarchical"
    matching_dist: "fixed"
    candidate_selection: "ball"
    max_distance: 1.5
    resample_to_gt: true # bcz it is already done during trexplorer-super evaluation

  mt_syn:
    matching: "one_to_one"
    matching_dist: "fixed"
    candidate_selection: "ball"
    max_distance: 10.0
    resample_to_gt: false

  parse2022:
    matching: "hierarchical"
    matching_dist: "fixed"
    candidate_selection: "ball"
    max_distance: 1.5
    resample_to_gt: false

  micro_ct:
    matching: "hierarchical"
    matching_dist: "fixed"
    candidate_selection: "ball"
    max_distance: 4.0
    resample_to_gt: true

